name: Deploy Digital Twin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: digital-twin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          working-directory: backend

      - name: Build Lambda package
        working-directory: backend
        run: uv run deploy.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check and build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.TWIN_API_URL }}
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: digital-twin-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.TWIN_LAMBDA_NAME }}" \
            --zip-file fileb://backend/lambda-deployment.zip \
            --no-cli-pager
          aws lambda wait function-updated-v2 \
            --function-name "${{ vars.TWIN_LAMBDA_NAME }}"

      - name: Publish frontend
        run: |
          aws s3 sync frontend/out/ "s3://${{ vars.FRONTEND_BUCKET }}/" --delete --only-show-errors
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$INVALIDATION_ID"

      - name: Verify production
        run: |
          curl --fail-with-body --silent --show-error "${{ vars.TWIN_API_URL }}/health"
          curl --fail-with-body --silent --show-error --output /dev/null https://codacode.io/
